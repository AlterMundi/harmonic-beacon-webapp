# Harmonic Beacon Account authority. This project is isolated from the event
# runtime and publishes only two loopback HTTP ports for host nginx. Production
# and staging use different DATABASE_URL values and MUST resolve to different
# PostgreSQL databases or schemas.
services:
  account-staging-postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    env_file:
      - ${BEACON_ACCOUNT_STAGING_DB_ENV_FILE:?set_root_owned_staging_db_env_file}
    volumes:
      - beacon-account-staging-postgres:/var/lib/postgresql/data
    networks: [account_staging_db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 768M }
        reservations: { cpus: "0.1", memory: 128M }
    logging: &account_logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  migrate-production:
    image: harmonic-beacon/account:${BEACON_ACCOUNT_IMAGE_TAG:?set_exact_account_image_tag}
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - ${BEACON_ACCOUNT_PRODUCTION_ENV_FILE:?set_root_owned_production_env_file}
    networks: [account_production_db]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  migrate-staging:
    image: harmonic-beacon/account:${BEACON_ACCOUNT_IMAGE_TAG:?set_exact_account_image_tag}
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - ${BEACON_ACCOUNT_STAGING_ENV_FILE:?set_root_owned_staging_env_file}
    networks: [account_staging_db]
    depends_on:
      account-staging-postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  provision-production:
    image: harmonic-beacon/account:${BEACON_ACCOUNT_IMAGE_TAG:?set_exact_account_image_tag}
    restart: "no"
    command: ["npm", "run", "account:provision"]
    env_file:
      - ${BEACON_ACCOUNT_PRODUCTION_ENV_FILE:?set_root_owned_production_env_file}
    networks: [account_production_db, account_mail_production, account_egress_production]
    depends_on:
      migrate-production: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  provision-staging:
    image: harmonic-beacon/account:${BEACON_ACCOUNT_IMAGE_TAG:?set_exact_account_image_tag}
    restart: "no"
    command: ["npm", "run", "account:provision"]
    env_file:
      - ${BEACON_ACCOUNT_STAGING_ENV_FILE:?set_root_owned_staging_env_file}
    networks: [account_staging_db, account_mail_staging, account_egress_staging]
    depends_on:
      migrate-staging: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  account-mail-worker-production:
    image: harmonic-beacon/account:${BEACON_ACCOUNT_IMAGE_TAG:?set_exact_account_image_tag}
    restart: unless-stopped
    init: true
    command: ["npm", "run", "account:mail-worker"]
    env_file:
      - ${BEACON_ACCOUNT_MAIL_WORKER_PRODUCTION_ENV_FILE:?set_root_owned_production_mail_worker_env_file}
    environment:
      NODE_ENV: production
      BEACON_GIT_SHA: ${BEACON_ACCOUNT_GIT_SHA:?set_exact_account_git_sha}
      BEACON_BUILD_TIME: ${BEACON_ACCOUNT_BUILD_TIME:?set_account_build_time}
      BEACON_DATABASE_SCHEMA_VERSION: ${BEACON_ACCOUNT_SCHEMA_VERSION:?set_account_schema_version}
      BEACON_ACCOUNT_MAIL_WORKER_HEARTBEAT_FILE: /tmp/beacon-account-mail-worker-heartbeat
    networks: [account_production_db, account_mail_production]
    depends_on:
      provision-production: { condition: service_completed_successfully }
    healthcheck: &mail_worker_health
      test:
        - CMD-SHELL
        - >-
          test -s /tmp/beacon-account-mail-worker-heartbeat &&
          node -e "const fs=require('node:fs');const p='/tmp/beacon-account-mail-worker-heartbeat';const h=JSON.parse(fs.readFileSync(p,'utf8'));if(h.status!=='ok'||h.gitSha!==process.env.BEACON_GIT_SHA||Date.now()-Date.parse(h.at)>120000||!Number.isInteger(h.pendingCount)||h.pendingCount<0||h.oldestPendingSeconds>300||h.consecutiveErrors!==0)process.exit(1)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
        reservations: { cpus: "0.05", memory: 96M }
    logging: *account_logging

  account-mail-worker-staging:
    image: harmonic-beacon/account:${BEACON_ACCOUNT_IMAGE_TAG:?set_exact_account_image_tag}
    restart: unless-stopped
    init: true
    command: ["npm", "run", "account:mail-worker"]
    env_file:
      - ${BEACON_ACCOUNT_MAIL_WORKER_STAGING_ENV_FILE:?set_root_owned_staging_mail_worker_env_file}
    environment:
      NODE_ENV: production
      BEACON_GIT_SHA: ${BEACON_ACCOUNT_GIT_SHA:?set_exact_account_git_sha}
      BEACON_BUILD_TIME: ${BEACON_ACCOUNT_BUILD_TIME:?set_account_build_time}
      BEACON_DATABASE_SCHEMA_VERSION: ${BEACON_ACCOUNT_SCHEMA_VERSION:?set_account_schema_version}
      BEACON_ACCOUNT_MAIL_WORKER_HEARTBEAT_FILE: /tmp/beacon-account-mail-worker-heartbeat
    networks: [account_staging_db, account_mail_staging]
    depends_on:
      provision-staging: { condition: service_completed_successfully }
    healthcheck: *mail_worker_health
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
        reservations: { cpus: "0.05", memory: 96M }
    logging: *account_logging

  account-production:
    image: harmonic-beacon/account:${BEACON_ACCOUNT_IMAGE_TAG:?set_exact_account_image_tag}
    build:
      context: ../..
      target: runner
      args:
        NEXT_PUBLIC_LIVEKIT_URL: https://livekit.example.invalid
        BEACON_GIT_SHA: ${BEACON_ACCOUNT_GIT_SHA:?set_exact_account_git_sha}
        BEACON_BUILD_TIME: ${BEACON_ACCOUNT_BUILD_TIME:?set_account_build_time}
        BEACON_DATABASE_SCHEMA_VERSION: ${BEACON_ACCOUNT_SCHEMA_VERSION:?set_account_schema_version}
    restart: unless-stopped
    init: true
    env_file:
      - ${BEACON_ACCOUNT_PRODUCTION_ENV_FILE:?set_root_owned_production_env_file}
    environment:
      NODE_ENV: production
      BEACON_GIT_SHA: ${BEACON_ACCOUNT_GIT_SHA:?set_exact_account_git_sha}
      BEACON_BUILD_TIME: ${BEACON_ACCOUNT_BUILD_TIME:?set_account_build_time}
      BEACON_DATABASE_SCHEMA_VERSION: ${BEACON_ACCOUNT_SCHEMA_VERSION:?set_account_schema_version}
    ports:
      - "127.0.0.1:${BEACON_ACCOUNT_PRODUCTION_PORT:-13002}:3000"
    networks: [account_production_db, account_mail_production, account_egress_production]
    depends_on:
      provision-production: { condition: service_completed_successfully }
      account-mail-worker-production: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "-H", "Host: account.harmonicbeacon.com", "http://127.0.0.1:3000/api/account/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
        reservations: { cpus: "0.25", memory: 256M }
    logging: *account_logging

  account-staging:
    image: harmonic-beacon/account:${BEACON_ACCOUNT_IMAGE_TAG:?set_exact_account_image_tag}
    restart: unless-stopped
    init: true
    env_file:
      - ${BEACON_ACCOUNT_STAGING_ENV_FILE:?set_root_owned_staging_env_file}
    environment:
      NODE_ENV: production
      BEACON_GIT_SHA: ${BEACON_ACCOUNT_GIT_SHA:?set_exact_account_git_sha}
      BEACON_BUILD_TIME: ${BEACON_ACCOUNT_BUILD_TIME:?set_account_build_time}
      BEACON_DATABASE_SCHEMA_VERSION: ${BEACON_ACCOUNT_SCHEMA_VERSION:?set_account_schema_version}
    ports:
      - "127.0.0.1:${BEACON_ACCOUNT_STAGING_PORT:-13003}:3000"
    networks: [account_staging_db, account_mail_staging, account_egress_staging]
    depends_on:
      provision-staging: { condition: service_completed_successfully }
      account-mail-worker-staging: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "-H", "Host: account-staging.harmonicbeacon.com", "http://127.0.0.1:3000/api/account/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
        reservations: { cpus: "0.25", memory: 256M }
    logging: *account_logging

networks:
  account_production_db:
    external: true
    name: earlybirds_preview_db_internal
  account_staging_db:
    internal: true
  account_mail_production:
    external: true
    name: beacon_account_mail_production
  account_mail_staging:
    external: true
    name: beacon_account_mail_staging
  account_egress_production:
    name: beacon_account_production_egress
  account_egress_staging:
    name: beacon_account_staging_egress

volumes:
  beacon-account-staging-postgres:
    name: beacon-account-staging-postgres
