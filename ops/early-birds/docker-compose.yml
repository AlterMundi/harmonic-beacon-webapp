# Isolated EarlyBirds observability preview. No service publishes a metrics/admin port.
services:
  config-init:
    image: alpine:3.21.3
    restart: "no"
    secrets: [telegram_chat_id]
    volumes:
      - ./alertmanager/alertmanager.yml.tmpl:/template/alertmanager.yml.tmpl:ro
      - alertmanager-runtime:/runtime
    command:
      - /bin/sh
      - -ec
      - |
        chat_id="$$(tr -d '\r\n' </run/secrets/telegram_chat_id)"
        printf '%s\n' "$$chat_id" | grep -Eq '^-?[0-9]+$$' || { echo 'invalid Telegram chat id' >&2; exit 1; }
        sed "s/__TELEGRAM_CHAT_ID__/$$chat_id/g" /template/alertmanager.yml.tmpl > /runtime/alertmanager.yml
    networks: [observability]

  alertmanager-secret-init:
    image: alpine:3.21.3
    restart: "no"
    network_mode: none
    secrets: [telegram_bot_token]
    volumes: [alertmanager-secrets:/runtime-secrets]
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        cp /run/secrets/telegram_bot_token /runtime-secrets/telegram_bot_token
        chown 65534:65534 /runtime-secrets/telegram_bot_token
        chmod 0400 /runtime-secrets/telegram_bot_token

  prometheus:
    image: prom/prometheus:v3.4.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=8GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: [127.0.0.1:9090:9090]
    networks: [observability, ops_edge, authority_private]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    depends_on:
      config-init: { condition: service_completed_successfully }
      alertmanager-secret-init: { condition: service_completed_successfully }
    command:
      - --config.file=/runtime/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - alertmanager-runtime:/runtime:ro
      - alertmanager-secrets:/runtime-secrets:ro
      - ./alertmanager/telegram.tmpl:/etc/alertmanager/templates/telegram.tmpl:ro
      - alertmanager-data:/alertmanager
    ports: [127.0.0.1:9093:9093]
    networks: [observability, ops_edge]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --web.listen-address=0.0.0.0:9100
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks: [observability]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    command: ["-housekeeping_interval=15s", "-docker_only=true"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [observability]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  canary-secret-init:
    image: alpine:3.21.3
    restart: "no"
    network_mode: none
    secrets: [beacon_stream_signing_secret]
    volumes: [canary-runtime:/runtime]
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        cp /run/secrets/beacon_stream_signing_secret /runtime/signing_secret
        chown 1000:1000 /runtime/signing_secret
        chmod 0400 /runtime/signing_secret

  canary-exporter:
    build: ./canary
    restart: unless-stopped
    depends_on:
      canary-secret-init: { condition: service_completed_successfully }
    environment:
      BEACON_STREAM_SIGNING_SECRET_FILE: /runtime/signing_secret
      BEACON_STREAM_PUBLIC_ORIGIN: ${BEACON_STREAM_PUBLIC_ORIGIN:?set in the root-owned ops env file}
      BEACON_STREAM_ARTIFACT_ID: ${BEACON_STREAM_ARTIFACT_ID:?set in the root-owned ops env file}
      BEACON_CANARY_INTERVAL_MS: 30000
      BEACON_CANARY_DECODER_TIMEOUT_MS: 20000
    volumes: [canary-runtime:/runtime:ro]
    # The canary needs outbound HTTPS to exercise the public origin. Its
    # metrics remain available only to Prometheus on `observability`.
    networks: [observability, ops_edge]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192M }

networks:
  observability:
    external: true
    name: earlybirds_stream_observability
  # Explicit egress plus loopback-published admin ports. No service publishes
  # a wildcard host port on this bridge.
  ops_edge:
    name: earlybirds_observability_edge
  authority_private:
    external: true
    name: earlybirds_authority_private

volumes:
  prometheus-data:
  alertmanager-data:
  alertmanager-runtime:
  alertmanager-secrets:
  canary-runtime:

secrets:
  telegram_bot_token:
    file: ${TELEGRAM_BOT_TOKEN_FILE:?set a root-owned secret file outside Git}
  telegram_chat_id:
    file: ${TELEGRAM_CHAT_ID_FILE:?set a root-owned secret file outside Git}
  beacon_stream_signing_secret:
    file: ${BEACON_STREAM_SIGNING_SECRET_FILE:?set a root-owned secret file outside Git}
