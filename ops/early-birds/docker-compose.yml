# Isolated EarlyBirds observability preview. No service publishes a metrics/admin port.
services:
  config-init:
    image: alpine:3.21.3
    restart: "no"
    secrets: [telegram_chat_id]
    volumes:
      - ./alertmanager/alertmanager.yml.tmpl:/template/alertmanager.yml.tmpl:ro
      - alertmanager-runtime:/runtime
    command:
      - /bin/sh
      - -ec
      - |
        chat_id="$$(tr -d '\r\n' </run/secrets/telegram_chat_id)"
        case "$$chat_id" in -[0-9]*|[0-9]*) ;; *) echo 'invalid Telegram chat id' >&2; exit 1;; esac
        sed "s/__TELEGRAM_CHAT_ID__/$$chat_id/g" /template/alertmanager.yml.tmpl > /runtime/alertmanager.yml
    networks: [observability]

  prometheus:
    image: prom/prometheus:v3.4.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-lifecycle=false
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts: [host.docker.internal:host-gateway]
    ports: [127.0.0.1:9090:9090]
    networks: [observability]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    depends_on:
      config-init: { condition: service_completed_successfully }
    command:
      - --config.file=/runtime/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    secrets: [telegram_bot_token]
    volumes:
      - alertmanager-runtime:/runtime:ro
      - ./alertmanager/telegram.tmpl:/etc/alertmanager/templates/telegram.tmpl:ro
      - alertmanager-data:/alertmanager
    ports: [127.0.0.1:9093:9093]
    networks: [observability]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    command: ["-housekeeping_interval=15s", "-docker_only=true"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [observability]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  canary-exporter:
    build: ./canary
    restart: unless-stopped
    secrets: [canary_manifest_url]
    environment:
      BEACON_CANARY_MANIFEST_URL_FILE: /run/secrets/canary_manifest_url
      BEACON_CANARY_INTERVAL_MS: 30000
    networks: [observability]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

networks:
  observability:
    external: true
    name: earlybirds_stream_observability

volumes:
  prometheus-data:
  alertmanager-data:
  alertmanager-runtime:

secrets:
  telegram_bot_token:
    file: ${TELEGRAM_BOT_TOKEN_FILE:?set a root-owned secret file outside Git}
  telegram_chat_id:
    file: ${TELEGRAM_CHAT_ID_FILE:?set a root-owned secret file outside Git}
  canary_manifest_url:
    file: ${BEACON_CANARY_MANIFEST_URL_FILE:?set a root-owned secret file outside Git}
