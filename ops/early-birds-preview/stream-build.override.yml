# Compose resolves relative paths from the first -f file. This last overlay
# deliberately replaces services/beacon-stream/docker-compose.yml's `build: .`
# after it is merged, keeping the origin build rooted at its own service.
services:
  beacon-stream:
    build:
      context: ../../services/beacon-stream
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 5s
