# LiveKit server configuration — mona (weekend MVP)
# Deploy to: /etc/harmonic-beacon/livekit.yaml  (mode 0600, root:root)
#
# Signaling:     localhost:7880 (behind nginx with TLS)
# Media:         public IP, UDP+TCP ICE mux on 7881
# TURN:          UDP 3478 (open for restrictive-network fallback)
# Relay ports:   30000-30200/udp (tight for ~150 attendees)

port: 7880

rtc:
  udp_port: 7881
  tcp_port: 7881
  use_external_ip: true

turn:
  enabled: true
  domain: live.harmonicbeacon.com
  udp_port: 3478
  relay_range_start: 30000
  relay_range_end: 30200

logging:
  level: info

room:
  empty_timeout: 300     # 5 min before auto-delete
  departure_timeout: 20  # 20 s grace on disconnect
