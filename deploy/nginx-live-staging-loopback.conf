# First-stage Live acceptance endpoint. This listener is intentionally bound
# to host loopback until DNS, a dedicated certificate and Account staging are
# ready. It cannot receive public traffic and does not alter the production
# live.harmonicbeacon.com vhost.
limit_req_zone $binary_remote_addr zone=live_staging_general:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=live_staging_auth:1m rate=10r/m;

server {
    listen 127.0.0.1:13200;
    server_name live-staging.harmonicbeacon.com;

    access_log /var/log/nginx/live-staging-access.log;
    error_log /var/log/nginx/live-staging-error.log warn;

    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Harmonic-Beacon-Environment "live-staging" always;
    client_max_body_size 64k;

    if ($host != live-staging.harmonicbeacon.com) { return 444; }

    # Test-only session minting never belongs on the hostname that will become
    # public. Local browser E2E uses its own throwaway app/database runtime.
    location = /test-login {
        return 404;
    }

    location = /api/test-login {
        return 404;
    }

    location = /api/internal {
        return 404;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    # No LiveKit is attached to this isolated acceptance stack.
    location ^~ /rtc {
        return 503;
    }

    location = /api/account/login {
        limit_req zone=live_staging_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location / {
        limit_req zone=live_staging_general burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
