# Harmonic Beacon — Nginx reverse proxy (mona)
# Deploy to: /etc/nginx/sites-available/harmonic-beacon
# Enable:    ln -sf /etc/nginx/sites-available/harmonic-beacon /etc/nginx/sites-enabled/
# SSL:       managed by Certbot (auto-modifies this file)
#
# Proxies: app (127.0.0.1:3000), LiveKit signaling+WS (127.0.0.1:7880), tapestry (127.0.0.1:3100)

upstream harmonic_beacon_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream livekit_signal {
    server 127.0.0.1:7880;
    keepalive 32;
}

upstream tapestry_service {
    server 127.0.0.1:3100;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Rate limiting: 10 req/s per IP for the API zone
limit_req_zone $binary_remote_addr zone=beacon_api:10m rate=10r/s;

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name live.harmonicbeacon.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    client_max_body_size 100M;
    server_name live.harmonicbeacon.com;

    # SSL managed by Certbot — paths filled by `certbot --nginx`. Keep this
    # file aligned with mona: that host does not install the optional shared
    # options or DH-parameter snippets.
    ssl_certificate     /etc/letsencrypt/live/live.harmonicbeacon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.harmonicbeacon.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Defense in depth: no future server-only API is exposed by the public
    # reverse proxy unless it receives an explicit location of its own.
    location = /api/internal {
        return 404;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    # Authentication failures are also throttled in the app. This outer limit
    # bounds request floods before they consume Node/Postgres capacity while
    # retaining a generous burst for attendees behind a shared NAT.
    location ^~ /api/auth/ {
        limit_req zone=beacon_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://harmonic_beacon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Tapestry composite endpoint (public, no auth) ---
    location ^~ /api/tapestry/ {
        proxy_pass http://tapestry_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # --- LiveKit realtime signaling (WebSocket upgrade) ---
    location /rtc {
        proxy_pass http://livekit_signal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- LiveKit Twirp API (server-side; auth via LIVEKIT_KEYS) ---
    location /twirp/ {
        proxy_pass http://livekit_signal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # --- Next.js static assets (aggressive caching) ---
    location /_next/static/ {
        proxy_pass http://harmonic_beacon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Health check (no auth, short timeouts) ---
    location /api/health {
        proxy_pass http://harmonic_beacon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # --- Static operator status page (kept outside the app for outages) ---
    location = /status {
        alias /var/www/harmonic-beacon/status.html;
        default_type text/html;
    }

    # --- Next.js app (everything else) ---
    location / {
        proxy_pass http://harmonic_beacon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
