# Harmonic Beacon — Nginx reverse proxy (mona)
# Deploy to: /etc/nginx/sites-available/harmonic-beacon
# Enable:    ln -sf /etc/nginx/sites-available/harmonic-beacon /etc/nginx/sites-enabled/
# SSL:       managed by Certbot (auto-modifies this file)
#
# Proxies: app (127.0.0.1:3000), LiveKit signaling+WS (127.0.0.1:7880)

upstream harmonic_beacon_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream livekit_signal {
    server 127.0.0.1:7880;
    keepalive 32;
}

upstream harmonic_beacon_analytics {
    server 127.0.0.1:3300;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Rate limiting: 10 req/s per IP for the API zone
limit_req_zone $binary_remote_addr zone=beacon_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=live_account_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=beacon_analytics:10m rate=20r/s;

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name live.harmonicbeacon.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    client_max_body_size 100M;
    server_name live.harmonicbeacon.com;

    # SSL managed by Certbot — paths filled by `certbot --nginx`. Keep this
    # file aligned with mona: that host does not install the optional shared
    # options or DH-parameter snippets.
    ssl_certificate     /etc/letsencrypt/live/live.harmonicbeacon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.harmonicbeacon.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Defense in depth: no future server-only API is exposed by the public
    # reverse proxy unless it receives an explicit location of its own.
    location = /api/internal {
        return 404;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    # Exact central Account RP surface. OAuth code/state and logout sid values
    # are private one-use/session material and must never enter the general
    # access log. Unknown suffixes remain denied until separately reviewed.
    location = /api/account/login {
        if ($request_method != GET) { return 405; }
        access_log off;
        limit_req zone=live_account_auth burst=5 nodelay;
        limit_req_status 429;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_pass http://harmonic_beacon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location = /api/account/callback {
        if ($request_method != GET) { return 405; }
        access_log off;
        limit_req zone=live_account_auth burst=10 nodelay;
        limit_req_status 429;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_pass http://harmonic_beacon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location = /api/account/frontchannel-logout {
        if ($request_method != GET) { return 405; }
        access_log off;
        limit_req zone=live_account_auth burst=10 nodelay;
        limit_req_status 429;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        # No X-Frame-Options: the app supplies an issuer-scoped
        # frame-ancestors policy for OIDC front-channel logout.
        proxy_pass http://harmonic_beacon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location ^~ /api/account/ {
        access_log off;
        return 404;
    }

    # Authentication failures are also throttled in the app. This outer limit
    # bounds request floods before they consume Node/Postgres capacity while
    # retaining a generous burst for attendees behind a shared NAT.
    location ^~ /api/auth/ {
        limit_req zone=beacon_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://harmonic_beacon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # First-party analytics is operationally isolated from the app. A collector
    # outage returns only here and cannot consume the application upstream.
    # Prometheus-style process counters are intentionally loopback-only.
    location = /_a/metrics {
        access_log off;
        return 404;
    }

    location ^~ /_a/ {
        access_log off;
        client_max_body_size 64k;
        limit_req zone=beacon_analytics burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://harmonic_beacon_analytics/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The collector trusts one proxy hop. Do not append a caller-supplied
        # X-Forwarded-For value or it could spoof country attribution.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_next_upstream off;
    }

    # --- LiveKit realtime signaling (WebSocket upgrade) ---
    location /rtc {
        proxy_pass http://livekit_signal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- LiveKit Twirp API (server-side; auth via LIVEKIT_KEYS) ---
    location /twirp/ {
        proxy_pass http://livekit_signal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # --- Next.js static assets (aggressive caching) ---
    location /_next/static/ {
        proxy_pass http://harmonic_beacon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Health check (no auth, short timeouts) ---
    location /api/health {
        proxy_pass http://harmonic_beacon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # --- Static operator status page (kept outside the app for outages) ---
    location = /status {
        alias /var/www/harmonic-beacon/status.html;
        default_type text/html;
    }

    # --- Next.js app (everything else) ---
    location / {
        proxy_pass http://harmonic_beacon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
