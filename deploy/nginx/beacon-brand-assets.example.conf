# Insert these exact locations in the selected existing HTTPS server only.
# Substitute the reviewed immutable asset-set SHA; retain that server's
# existing security headers in BOTH locations because add_header stops inheritance.
location = /assets/hb-global-nav.js {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    access_log off;
    alias /var/lib/harmonic-beacon/brand-assets/ASSET_SET_SHA256/hb-global-nav.js;
    default_type application/javascript;
    add_header Cache-Control "public, max-age=300" always;
    # Copy the selected server's security headers here, unchanged.
}
location = /favicon.ico {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    access_log off;
    alias /var/lib/harmonic-beacon/brand-assets/ASSET_SET_SHA256/favicon.ico;
    default_type image/x-icon;
    add_header Cache-Control "public, max-age=300" always;
    # Copy the selected server's security headers here, unchanged.
}
