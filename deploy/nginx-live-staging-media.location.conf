# Replace ONLY the /rtc denial inside the live-staging TLS server block after
# isolated media admission. Keep the denial snippet for rollback. No production
# vhost, certificate, DNS or Account route changes are part of this extension.
location = /rtc {
    return 404;
}
location ^~ /rtc/ {
    access_log off;
    # WebSocket authorization travels in the query string; upstream errors must
    # not persist that request URL either. Diagnose through bounded health probes.
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:43880/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
