# Temporary HTTP-only bootstrap for the Live staging certificate. Install it
# only while the certificate is absent. It never proxies Live, Account, event,
# media, internal API or test-login traffic.
server {
    listen 80;
    listen [::]:80;
    server_name live-staging.harmonicbeacon.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 503; }
}
