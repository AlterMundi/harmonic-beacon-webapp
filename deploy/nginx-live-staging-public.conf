limit_req_zone $binary_remote_addr zone=live_staging_public_general:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=live_staging_public_auth:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name live-staging.harmonicbeacon.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name live-staging.harmonicbeacon.com;

    ssl_certificate /etc/letsencrypt/live/live-staging.harmonicbeacon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live-staging.harmonicbeacon.com/privkey.pem;

    access_log /var/log/nginx/live-staging-access.log;
    error_log /var/log/nginx/live-staging-error.log warn;

    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Harmonic-Beacon-Environment "live-staging" always;
    client_max_body_size 64k;

    if ($host != live-staging.harmonicbeacon.com) { return 444; }

    location = /test-login { return 404; }
    location = /api/test-login { return 404; }
    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }

    # LiveKit is deliberately absent from identity staging. Room/media
    # acceptance remains in the repository's isolated PostgreSQL + E2E stack.
    location ^~ /rtc { return 503; }

    location = /api/account/login {
        if ($request_method != GET) { return 405; }
        access_log off;
        limit_req zone=live_staging_public_auth burst=5 nodelay;
        limit_req_status 429;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Harmonic-Beacon-Environment "live-staging" always;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # OAuth code and state are one-use private values and never enter access
    # logs, even when callback validation fails.
    location = /api/account/callback {
        if ($request_method != GET) { return 405; }
        access_log off;
        limit_req zone=live_staging_public_auth burst=10 nodelay;
        limit_req_status 429;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Harmonic-Beacon-Environment "live-staging" always;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location = /api/account/frontchannel-logout {
        if ($request_method != GET) { return 405; }
        access_log off;
        limit_req zone=live_staging_public_auth burst=10 nodelay;
        limit_req_status 429;
        add_header Cache-Control "private, no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        # No X-Frame-Options here: the app narrows frame-ancestors to the exact
        # Account staging issuer for signed front-channel logout.
        add_header X-Harmonic-Beacon-Environment "live-staging" always;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location ^~ /api/account/ {
        access_log off;
        return 404;
    }

    location / {
        limit_req zone=live_staging_public_general burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
