name: Listen delivery

on:
  pull_request:
    branches: [early-birds]
    paths:
      - .github/workflows/listener-delivery.yml
      - ops/listener-delivery/**
      - scripts/listener-delivery/**
      - scripts/listener-account-production/**
      - scripts/early-birds-preview/**
      - ops/listener-account-production/**
      - ops/early-birds-preview/**
      - contracts/early-bird-authority/v3/**
      - contracts/early-bird-membership/v2/**
  workflow_dispatch:
    inputs:
      target:
        description: Exact isolated Listen target
        required: true
        type: choice
        options: [staging, production]
      operation:
        description: Bounded root-helper operation
        required: true
        default: probe
        type: choice
        options: [probe, status, preflight, deploy, smoke, rollback]
      source_sha:
        description: Exact lowercase early-birds SHA40; must equal the current lane head
        required: true
        type: string
      ci_run_id:
        description: Successful EarlyBirds fast-forward run ID for source_sha
        required: true
        type: string
      ci_run_attempt:
        description: Exact successful CI run attempt
        required: true
        type: string
      interruption_drill:
        description: Restore the prior synthetic staging preview at the armed checkpoint
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: listen-delivery-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pr' }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541d8b243d3c42e24b1b0d3259c689
        with:
          node-version: '22.22'
      - name: Validate the Listen adapter only
        run: |
          npm --prefix ops/listener-delivery/v1 run check
          npm --prefix ops/listener-delivery/v1 test
          npm --prefix ops/listener-account-production run check
          npm --prefix ops/listener-account-production test
          npm --prefix ops/early-birds-preview run check
          npm --prefix ops/early-birds-preview test

  bind-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Bind exact early-birds source and successful CI attempt
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin +refs/heads/early-birds:refs/remotes/origin/early-birds
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/early-birds
          test "$SOURCE_SHA" = "$(git rev-parse refs/remotes/origin/early-birds)"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
          jq -e --arg sha "$SOURCE_SHA" --argjson attempt "$CI_RUN_ATTEMPT" '
            .head_sha == $sha and .head_branch == "early-birds" and
            .event == "push" and .status == "completed" and .conclusion == "success" and
            .path == ".github/workflows/early-birds-fast-forward.yml" and
            .run_attempt == $attempt
          ' <<<"$ci" >/dev/null

  staging:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
    needs: bind-dispatch
    environment: listener-staging
    runs-on: [self-hosted, mona, listener-staging]
    timeout-minutes: 30
    env:
      OPERATION: ${{ inputs.operation }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
      CHECKPOINT_MODE: ${{ inputs.interruption_drill && 'interrupt' || 'deliver' }}
      LISTENER_DELIVERY_BUNDLE_MANIFEST_SHA256: ${{ vars.LISTENER_DELIVERY_BUNDLE_MANIFEST_SHA256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Require the externally provisioned root-owned helper
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/hb-listener-delivery
          test "$(stat -c '%U:%G:%a' /usr/local/sbin/hb-listener-delivery)" = root:root:755
          [[ "$LISTENER_DELIVERY_BUNDLE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum /usr/local/libexec/hb-listener-delivery/v1/bundle.manifest.json | cut -d ' ' -f 1)" = "$LISTENER_DELIVERY_BUNDLE_MANIFEST_SHA256"
      - name: Probe staging adapter
        if: inputs.operation == 'probe'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-listener-delivery \
            probe staging "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" deliver \
            > "$RUNNER_TEMP/listen-receipt.json"
      - name: Show staging status
        if: inputs.operation == 'status'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-listener-delivery \
            status staging "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" deliver \
            > "$RUNNER_TEMP/listen-receipt.json"
      - name: Preflight staging delivery
        if: inputs.operation == 'preflight'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-listener-delivery \
            preflight staging "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" deliver \
            > "$RUNNER_TEMP/listen-receipt.json"
      - name: Deploy staging Listener
        if: inputs.operation == 'deploy' && !inputs.interruption_drill
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-listener-delivery \
            deploy staging "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" deliver \
            > "$RUNNER_TEMP/listen-receipt.json"
      - name: Run rollback rehearsal checkpoint with cleanup proof
        if: inputs.operation == 'deploy' && inputs.interruption_drill
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-listener-delivery \
            deploy staging "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" interrupt \
            > "$RUNNER_TEMP/listen-receipt.json"
      - name: Smoke staging Listener
        if: inputs.operation == 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-listener-delivery \
            smoke staging "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" deliver \
            > "$RUNNER_TEMP/listen-receipt.json"
      - name: Roll back staging Listener
        if: inputs.operation == 'rollback'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-listener-delivery \
            rollback staging "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" deliver \
            > "$RUNNER_TEMP/listen-receipt.json"
      - name: Upload non-secret delivery or recovery receipt
        if: inputs.operation == 'deploy' || inputs.operation == 'rollback'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: listen-staging-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/listen-receipt.json
          if-no-files-found: error
          retention-days: 30

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs: bind-dispatch
    environment: listener-production
    runs-on: [self-hosted, mona, listener-production]
    timeout-minutes: 30
    env:
      OPERATION: ${{ inputs.operation }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
      INTERRUPTION_DRILL: ${{ inputs.interruption_drill }}
      LISTENER_DELIVERY_BUNDLE_MANIFEST_SHA256: ${{ vars.LISTENER_DELIVERY_BUNDLE_MANIFEST_SHA256 }}
    steps:
      - name: Require external protected-environment provisioning
        shell: bash
        env:
          PROTECTED_ENVIRONMENT_MARKER: ${{ vars.LISTENER_DELIVERY_PROTECTED_ENVIRONMENT }}
        run: test "$PROTECTED_ENVIRONMENT_MARKER" = listener-production-v1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Require the externally provisioned root-owned helper
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/hb-listener-delivery
          test "$(stat -c '%U:%G:%a' /usr/local/sbin/hb-listener-delivery)" = root:root:755
          [[ "$LISTENER_DELIVERY_BUNDLE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum /usr/local/libexec/hb-listener-delivery/v1/bundle.manifest.json | cut -d ' ' -f 1)" = "$LISTENER_DELIVERY_BUNDLE_MANIFEST_SHA256"
      - name: Reject production interruption drill
        shell: bash
        run: test "$INTERRUPTION_DRILL" = false
      - name: Probe production adapter
        if: inputs.operation == 'probe'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-listener-delivery \
            probe production "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" deliver \
            > "$RUNNER_TEMP/listen-receipt.json"
      - name: Show production status
        if: inputs.operation == 'status'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-listener-delivery \
            status production "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" deliver \
            > "$RUNNER_TEMP/listen-receipt.json"
      - name: Preflight production delivery
        if: inputs.operation == 'preflight'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-listener-delivery \
            preflight production "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" deliver \
            > "$RUNNER_TEMP/listen-receipt.json"
      - name: Deploy production Listener
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-listener-delivery \
            deploy production "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" deliver \
            > "$RUNNER_TEMP/listen-receipt.json"
      - name: Smoke production Listener
        if: inputs.operation == 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-listener-delivery \
            smoke production "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" deliver \
            > "$RUNNER_TEMP/listen-receipt.json"
      - name: Roll back production Listener
        if: inputs.operation == 'rollback'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-listener-delivery \
            rollback production "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" deliver \
            > "$RUNNER_TEMP/listen-receipt.json"
      - name: Upload non-secret delivery or recovery receipt
        if: inputs.operation == 'deploy' || inputs.operation == 'rollback'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: listen-production-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/listen-receipt.json
          if-no-files-found: error
          retention-days: 30
