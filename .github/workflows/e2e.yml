name: E2E quality gates

# Browser, accessibility, responsive, visual, and media-continuity gates
# (issue #69, epic #64). Runs the Playwright suites against a production
# build with the deterministic local stack:
#   - Postgres service with the committed fixture restored on top
#   - LiveKit dev server (container) for the media-continuity suite
# Everything is throwaway and seeded from db/test-fixture.sql — no
# production credentials or participant data.
#
# GitHub's hosted Linux runner supplies Docker for service containers and the
# LiveKit fixture. Chromium's visual gates run before WebKit dependencies are
# installed, because WebKit's extra system fonts change Chromium screenshot
# rasterization on GitHub's ephemeral runner. The mobile projects are
# emulations, not physical-device launch evidence.

on:
  pull_request:
    branches: [main, release]
    types: [opened, synchronize, reopened, edited, ready_for_review]
    # Documentation-only PRs cannot affect the browser/runtime contract. Keep
    # this filter scoped to pull_request: release deploys invoke workflow_call
    # and must always run the complete gate.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    # Drafts use focused checks while they are moving quickly. The
    # ready_for_review event above runs this complete matrix before review;
    # workflow_call (release/deploy) remains unconditional.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: beacon_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beacon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgresql://postgres:e2e@localhost:55432/beacon_test
      E2E_LIVEKIT_URL: ws://localhost:7880
      # The production-mode application must expose secure signaling even
      # against the job-local fixture. The load CLI keeps using plain loopback.
      E2E_LIVEKIT_PUBLIC_URL: wss://127.0.0.1:7881
      E2E_LIVEKIT_API_KEY: devkey
      E2E_LIVEKIT_API_SECRET: secret
      NEXT_PUBLIC_E2E_CONTINUITY_OBSERVER: '1'
    steps:
      - name: Prepare private short socket root
        # Never nest socket-bearing TMPDIR under RUNNER_TEMP (unbounded UTF-8).
        # run.ts nests navigation-account-XXXXXX and makes that child TMPDIR.
        # Keep the canonical root short even after browser profile nesting.
        run: &prepare-private-socket-root |
          set -euo pipefail
          test "$(id -u)" != 0
          umask 077
          root=$(mktemp -d /tmp/bci.XXXXXX)
          test "$root" = "$(realpath "$root")"
          test "$(stat -c %u "$root")" = "$(id -u)"
          test "$(stat -c %a "$root")" = 700
          mkdir -m 700 "$root/xdg" "$root/logs"
          printf 'BEACON_CI_ROOT=%s\nTMPDIR=%s\nXDG_RUNTIME_DIR=%s/xdg\n' "$root" "$root" "$root" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22'
          cache: 'npm'

      - name: Restore verified LiveKit load tester cache
        id: livekit-cli-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/livekit-load-cli/lk
          key: livekit-load-cli-v1-${{ runner.os }}-${{ runner.arch }}-go-1.25.8-${{ hashFiles('scripts/install-livekit-load-cli.sh', 'scripts/patches/livekit-cli-v2.16.3-vp8-depacketizer.patch') }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: steps.livekit-cli-cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.25.8'
          cache: false

      - run: npm ci

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Verify executable browser CI selection contracts
        run: npx vitest run --no-file-parallelism src/lib/__tests__/live-batch-browser-contract.test.ts src/lib/__tests__/live-batch-ci-contract.test.ts

      - name: Run isolated Chromium room-exit helper regressions
        run: |
          node --import tsx --test --test-name-pattern='^chromium two identified native RTC sources:' e2e/helpers/continuity-stack.test.ts
          npx playwright test --config e2e/helpers/playwright.config.ts --retries=0 --workers=1

      - name: Start LiveKit dev server
        run: |
          docker run -d --rm --name e2e-livekit --network host \
            livekit/livekit-server:v1.13.4 --dev --bind 0.0.0.0
          for i in $(seq 1 30); do
            curl -sf http://localhost:7880 >/dev/null && exit 0
            sleep 1
          done
          echo "LiveKit did not become ready" >&2
          exit 1

      - name: Start private TLS signaling proxy
        run: |
          set -euo pipefail
          umask 077
          cert="$BEACON_CI_ROOT/livekit.crt"
          key="$BEACON_CI_ROOT/livekit.key"
          log="$BEACON_CI_ROOT/logs/livekit-tls-proxy.log"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "$key" -out "$cert" -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          node e2e/fixtures/livekit-tls-proxy.mjs \
            --cert "$cert" --key "$key" \
            --listen-port 7881 --upstream-port 7880 >"$log" 2>&1 &
          proxy_pid=$!
          printf 'E2E_LIVEKIT_CA_CERT=%s\nLIVEKIT_TLS_PROXY_PID=%s\n' \
            "$cert" "$proxy_pid" >> "$GITHUB_ENV"
          for i in $(seq 1 50); do
            kill -0 "$proxy_pid"
            if curl --silent --show-error --fail --cacert "$cert" \
              https://127.0.0.1:7881 >/dev/null; then
              exit 0
            fi
            sleep 0.1
          done
          echo "Private LiveKit TLS proxy did not become ready" >&2
          exit 1

      - name: Build verified LiveKit load tester
        if: steps.livekit-cli-cache.outputs.cache-hit != 'true'
        run: scripts/install-livekit-load-cli.sh "$RUNNER_TEMP/livekit-load-cli/lk"

      - name: Verify cached or built LiveKit load tester
        run: |
          test -x "$RUNNER_TEMP/livekit-load-cli/lk"
          test "$("$RUNNER_TEMP/livekit-load-cli/lk" --version)" = \
            'lk version 2.16.3-hb-vp8.1'
          echo "$RUNNER_TEMP/livekit-load-cli" >> "$GITHUB_PATH"

      - name: Run small dual-LiveKit load profile
        run: npm run load:livekit -- --profile ci --run-id "ci-${GITHUB_RUN_ID}"
        env:
          LIVEKIT_URL: ${{ env.E2E_LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ env.E2E_LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ env.E2E_LIVEKIT_API_SECRET }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: livekit-load-manifest
          path: artifacts/load-test/

      - name: Restore fixture database
        run: |
          npm run db:fixture:load
          DATABASE_URL="$E2E_DATABASE_URL" npx prisma migrate deploy
          DATABASE_URL="$E2E_DATABASE_URL" npm run stage-grants:forward-drain
        env:
          LIVEKIT_INTERNAL_URL: http://localhost:7880
          LIVEKIT_API_KEY: ${{ env.E2E_LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ env.E2E_LIVEKIT_API_SECRET }}

      - name: Verify session contributions contract in PostgreSQL
        # Real-database proof of the CHAT-01 guarantees: idempotency unique
        # index, replay/conflict, concurrent-submission race, stable
        # (createdAt, id) order, public anonymity, cross-session isolation,
        # and the tail resumeCursor. Runs only that suite, against the same
        # throwaway fixture database the E2E gates use — no real data, no
        # production secrets.
        run: npx vitest run --no-file-parallelism src/lib/__tests__/session-contributions.integration.test.ts
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          CONTRIBUTIONS_INTEGRATION_TEST: '1'

      - name: Verify staging staff Account binding contract in PostgreSQL
        run: npx vitest run --no-file-parallelism scripts/live-staging/__tests__/bind-staff-account.integration.test.ts
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          STAFF_BINDING_INTEGRATION_TEST: '1'

      - name: Verify every migration against a clean database
        # The fixture proves migrations apply on an existing database; this
        # proves the whole chain also builds from zero. The scratch database
        # lives and dies inside the job's ephemeral Postgres service — the
        # fixture database is never reused or replaced for this check.
        run: |
          psql "$E2E_DATABASE_URL" \
            -c 'DROP DATABASE IF EXISTS beacon_migration_check' \
            -c 'CREATE DATABASE beacon_migration_check'
          CLEAN_URL="${E2E_DATABASE_URL/beacon_test/beacon_migration_check}"
          DATABASE_URL="$CLEAN_URL" npx prisma migrate deploy

      - name: Verify concurrent room token finalization in PostgreSQL
        # A login burst shares the event session lock. This catches isolation
        # regressions that unit mocks and a single browser cannot reproduce.
        run: npx vitest run --no-file-parallelism src/lib/__tests__/room-token-issue.integration.test.ts
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          ROOM_TOKEN_ISSUE_INTEGRATION_TEST: '1'

      - name: Run Chromium and Android gates
        run: >-
          npx playwright test --retries=0 --workers=1
          --project=chromium
          --project=w1440
          --project=w1024
          --project=w768
          --project=w390
          --project=w320
          --project=android-chrome

      - name: Install Firefox after Chromium screenshot gates
        run: npx playwright install --with-deps firefox

      - name: Run isolated Firefox room-exit helper regression
        run: node --import tsx --test --test-name-pattern='^Firefox automation reload' e2e/helpers/continuity-stack.test.ts

      - name: Start isolated browser audio backend
        # Firefox needs a real audio backend even for synthesized RTP. Without
        # one, AudioContext.resume() can remain pending after a genuine click.
        # Use a job-private socket and null sink, not a browser-policy override.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          umask 077
          socket="$BEACON_CI_ROOT/native"
          pulseaudio --daemonize=yes --use-pid-file=no --exit-idle-time=-1 -n \
            --log-target="file:$BEACON_CI_ROOT/logs/pulse.log" \
            --load="module-native-protocol-unix socket=$socket auth-anonymous=0" \
            --load="module-null-sink sink_name=beacon_ci rate=48000"
          PULSE_SERVER="unix:$socket" pactl info
          printf 'PULSE_SERVER=unix:%s\n' "$socket" >> "$GITHUB_ENV"

      - name: Run Firefox functional and accessibility gates
        run: npx playwright test --retries=0 --workers=1 --project=firefox
        env:
          E2E_REUSE_NEXT_BUILD: '1'

      - name: Install WebKit after Chromium screenshot gates
        run: npx playwright install --with-deps webkit

      - name: Run iPhone/WebKit media gate
        run: >-
          npx playwright test --retries=0 --workers=1
          e2e/tests/media-continuity.spec.ts
          e2e/tests/audio-activation.spec.ts
          e2e/tests/continuity-navigation.spec.ts
          --project=iphone-webkit
        env:
          E2E_REUSE_NEXT_BUILD: '1'

      - name: Verify grant, migration, commerce, and invitation durable outbox contracts
        # Real-PostgreSQL proof that grant revisions are serialized across two
        # workers and that stage, commerce, and invitation revocations all
        # commit their durable effects before LiveKit delivery.
        run: npx vitest run --no-file-parallelism src/lib/__tests__/stage-grant-effects.integration.test.ts src/lib/__tests__/stage-grant-migration.integration.test.ts src/lib/__tests__/commerce-entitlement.integration.test.ts src/lib/__tests__/promo-invitation.integration.test.ts
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          STAGE_GRANT_INTEGRATION_TEST: '1'
          COMMERCE_INTEGRATION_TEST: '1'
          TICKET_CODE_PEPPER: commerce-ci-ticket-pepper-at-least-32-characters
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: commerce-ci-livekit-secret-at-least-32-characters

      - name: Smoke production worker and stabilization entrypoints
        run: |
          docker build -t beacon-runtime-smoke \
            --build-arg NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880 .
          docker run --rm \
            -e BEACON_WORKER_IMPORT_SMOKE=1 \
            beacon-runtime-smoke \
            npx tsx scripts/commerce-media-worker.ts
          docker run --rm \
            beacon-runtime-smoke \
            npx tsx scripts/weekend-stabilize.ts --help
          docker run --rm \
            beacon-runtime-smoke \
            npx tsx scripts/stage-grant-rollback-preflight.ts --help

      - name: Capture LiveKit diagnostics
        if: failure()
        run: docker logs --tail 300 e2e-livekit

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.event.repository.private == true
        with:
          name: playwright-report
          retention-days: 3
          path: |
            playwright-report/
            test-results/helpers/
            ${{ env.BEACON_CI_ROOT }}/logs/livekit-tls-proxy.log

      - name: Stop LiveKit fixtures
        if: always()
        run: |
          set -euo pipefail
          if [[ "${LIVEKIT_TLS_PROXY_PID:-}" =~ ^[0-9]+$ ]] && \
             kill -0 "$LIVEKIT_TLS_PROXY_PID" 2>/dev/null; then
            cmdline=$(tr '\0' ' ' < "/proc/$LIVEKIT_TLS_PROXY_PID/cmdline")
            case "$cmdline" in
              *e2e/fixtures/livekit-tls-proxy.mjs*) kill -TERM "$LIVEKIT_TLS_PROXY_PID" ;;
              *) echo "Refusing to signal unexpected PID $LIVEKIT_TLS_PROXY_PID" >&2; exit 1 ;;
            esac
          fi
          docker rm --force e2e-livekit >/dev/null 2>&1 || true

  account:
    # Separate runner: no attachment to the legacy Account-disabled database/app.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CI: '1'
      NEXT_PUBLIC_E2E_CONTINUITY_OBSERVER: '1'
    steps:
      - name: Prepare private Account socket and evidence root
        run: *prepare-private-socket-root

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22'
          cache: 'npm'

      - run: npm ci

      - name: Verify Account protocol and isolated runtime contracts
        run: node --import tsx --test e2e/account-fixture/protocol.test.ts e2e/account-fixture/runtime-backend.test.ts

      - name: Install all Account browser engines and private audio dependencies
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils

      - name: Run isolated real Account four-project matrix
        # run.ts owns Docker PG16 + LiveKit v1.13.4, migrations, HTTPS issuer,
        # isolated build, runtime/source/results receipts and bounded cleanup.
        # No RP-only filter, list-only qualification or shared-stack fallback.
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          umask 077
          audio=$(mktemp -d "$BEACON_CI_ROOT/pulse-XXXXXX")
          chmod 700 "$audio"
          pulseaudio --daemonize=no --use-pid-file=no --exit-idle-time=-1 -n \
            --log-target="file:$audio/pulse.log" \
            --load="module-native-protocol-unix socket=$audio/native auth-anonymous=0" \
            --load="module-null-sink sink_name=account_ci rate=48000" &
          pulse_pid=$!
          cleanup_audio() {
            if kill -0 "$pulse_pid" 2>/dev/null; then
              kill -TERM "$pulse_pid"
              for i in $(seq 1 50); do
                if ! kill -0 "$pulse_pid" 2>/dev/null; then break; fi
                sleep 0.1
              done
              if kill -0 "$pulse_pid" 2>/dev/null; then kill -KILL "$pulse_pid"; fi
            fi
          }
          trap cleanup_audio EXIT
          for i in $(seq 1 100); do
            test -S "$audio/native" && break
            kill -0 "$pulse_pid"
            sleep 0.05
          done
          test -S "$audio/native"
          export PULSE_SERVER="unix:$audio/native" E2E_ACCOUNT_PULSE_DIR="$audio"
          pactl info
          E2E_ACCOUNT_BACKEND=docker node --import tsx e2e/account-fixture/run.ts \
            --project=chromium-account --project=android-chrome-account \
            --project=firefox-account --project=iphone-webkit-account \
            --retries=0 --workers=1

      - name: Retain private Account runtime and failure receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # Test credentials, session-bearing traces and logs must not become
        # public artifacts. Never upload the copied app, keys or PG data.
        # Public forks still run the gate, but do not publish these receipts.
        if: always() && github.event.repository.private == true
        with:
          name: account-private-runtime
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ env.BEACON_CI_ROOT }}/**/runtime.json
            ${{ env.BEACON_CI_ROOT }}/**/source-sha256.json
            ${{ env.BEACON_CI_ROOT }}/**/logs/**
            ${{ env.BEACON_CI_ROOT }}/**/results/**
            ${{ env.BEACON_CI_ROOT }}/pulse-*/pulse.log
