name: E2E quality gates

# Browser, accessibility, responsive, visual, and media-continuity gates
# (issue #69, epic #64). Runs the Playwright suites against a production
# build with the deterministic local stack:
#   - Postgres service with the committed fixture restored on top
#   - LiveKit dev server (container) for the media-continuity suite
# Everything is throwaway and seeded from db/test-fixture.sql — no
# production credentials or participant data.
#
# GitHub's hosted Linux runner supplies Docker for service containers and the
# LiveKit fixture. Chromium's visual gates run before WebKit dependencies are
# installed, because WebKit's extra system fonts change Chromium screenshot
# rasterization on GitHub's ephemeral runner. The mobile projects are
# emulations, not physical-device launch evidence.

on:
  pull_request:
    branches: [main, release]
  workflow_call:

concurrency:
  group: e2e-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: beacon_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beacon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgresql://postgres:e2e@localhost:55432/beacon_test
      E2E_LIVEKIT_URL: ws://localhost:7880
      E2E_LIVEKIT_API_KEY: devkey
      E2E_LIVEKIT_API_SECRET: secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Start LiveKit dev server
        run: |
          docker run -d --rm --name e2e-livekit --network host \
            livekit/livekit-server:v1.13.4 --dev --bind 0.0.0.0
          for i in $(seq 1 30); do
            curl -sf http://localhost:7880 >/dev/null && exit 0
            sleep 1
          done
          echo "LiveKit did not become ready" >&2
          exit 1

      - name: Install pinned LiveKit load tester
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lk.tar.gz" \
            https://github.com/livekit/livekit-cli/releases/download/v2.16.3/lk_2.16.3_linux_amd64.tar.gz
          echo "57935ce348a634a1e12769b9eaf7e684cf46920ad65e4b6d88f87a9cd01de2d6  $RUNNER_TEMP/lk.tar.gz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lk.tar.gz" -C "$RUNNER_TEMP" lk
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run small dual-LiveKit load profile
        run: npm run load:livekit -- --profile ci --run-id "ci-${GITHUB_RUN_ID}"
        env:
          LIVEKIT_URL: ${{ env.E2E_LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ env.E2E_LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ env.E2E_LIVEKIT_API_SECRET }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livekit-load-manifest
          path: artifacts/load-test/

      - name: Restore fixture database
        run: |
          npm run db:fixture:load
          DATABASE_URL="$E2E_DATABASE_URL" npx prisma migrate deploy

      - name: Run Chromium and Android gates
        run: >-
          npx playwright test
          --project=chromium
          --project=w1440
          --project=w1024
          --project=w390
          --project=w320
          --project=android-chrome

      - name: Install Firefox after Chromium screenshot gates
        run: npx playwright install --with-deps firefox

      - name: Run Firefox functional and accessibility gates
        run: npx playwright test --project=firefox

      - name: Install WebKit after Chromium screenshot gates
        run: npx playwright install --with-deps webkit

      - name: Run iPhone/WebKit media gate
        run: npx playwright test e2e/tests/media-continuity.spec.ts --project=iphone-webkit

      - name: Verify commerce transaction and durable outbox contract
        run: npx vitest run --no-file-parallelism src/lib/__tests__/commerce-entitlement.integration.test.ts src/lib/__tests__/promo-invitation.integration.test.ts
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          COMMERCE_INTEGRATION_TEST: '1'
          TICKET_CODE_PEPPER: commerce-ci-ticket-pepper-at-least-32-characters
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: commerce-ci-livekit-secret-at-least-32-characters

      - name: Capture LiveKit diagnostics
        if: failure()
        run: docker logs --tail 300 e2e-livekit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
