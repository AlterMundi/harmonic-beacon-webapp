name: CI

on:
  pull_request:
    branches: [main, release]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  diff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject whitespace errors in the complete candidate diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  impact:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.classify.outputs.app }}
      analytics: ${{ steps.classify.outputs.analytics }}
      tapestry: ${{ steps.classify.outputs.tapestry }}
      playlist: ${{ steps.classify.outputs.playlist }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Classify the complete pull-request delta
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          head="$HEAD_SHA"
          node scripts/hb.mjs change-impact --base "$base" --head "$head" --json > impact-plan.json
          jq -e '.schemaVersion=="harmonic-beacon.change-impact.v2"' impact-plan.json >/dev/null
          printf 'app=%s\n' "$(jq -r '.requiredJobChecks | index("lint-and-build") != null' impact-plan.json)" >> "$GITHUB_OUTPUT"
          printf 'analytics=%s\n' "$(jq -r '.requiredJobChecks | index("analytics") != null' impact-plan.json)" >> "$GITHUB_OUTPUT"
          printf 'tapestry=%s\n' "$(jq -r '.requiredJobChecks | index("tapestry") != null' impact-plan.json)" >> "$GITHUB_OUTPUT"
          printf 'playlist=%s\n' "$(jq -r '.requiredJobChecks | index("playlist") != null' impact-plan.json)" >> "$GITHUB_OUTPUT"
      - name: Verify generated agent skill distributions
        run: python3 .agents/skills/scripts/render_distributions.py --check
      - name: Verify shared operations tooling
        run: npm run test:ops-tooling
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: change-impact-${{ github.run_id }}
          path: impact-plan.json
          if-no-files-found: error

  lint-and-build:
    needs: impact
    if: needs.impact.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22'
          cache: 'npm'
      - run: npm ci
      - name: Reject high-severity production dependency regressions
        run: |
          npm run audit:production
          npm --prefix services/home audit --omit=dev --audit-level=high
          npm --prefix services/commerce-worker audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://dummy:***@localhost:5432/dummy
          NEXT_PUBLIC_LIVEKIT_URL: https://placeholder.livekit.cloud

  test:
    needs: impact
    if: needs.impact.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://dummy:***@localhost:5432/dummy
          NEXT_PUBLIC_LIVEKIT_URL: https://placeholder.livekit.cloud
      - run: npm run contract:commerce:verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-report
          path: coverage/

  tapestry:
    needs: impact
    if: needs.impact.outputs.tapestry == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22'
          cache: npm
          cache-dependency-path: services/tapestry/package-lock.json
      - run: npm ci --prefix services/tapestry
      - run: npm audit --omit=dev --prefix services/tapestry --audit-level=high
      - run: npm test --prefix services/tapestry

  playlist:
    needs: impact
    if: needs.impact.outputs.playlist == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22'
          cache: npm
          cache-dependency-path: services/playlist-bot/package-lock.json
      - run: npm ci --prefix services/playlist-bot
      - run: npm audit --omit=dev --prefix services/playlist-bot --audit-level=high
      - run: npm test --prefix services/playlist-bot

  analytics:
    needs: impact
    if: needs.impact.outputs.analytics == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: analytics_owner
          POSTGRES_PASSWORD: analytics_test_password
          POSTGRES_DB: analytics
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U analytics_owner -d analytics"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22'
          cache: npm
          cache-dependency-path: services/analytics/package-lock.json
      - run: npm ci --prefix services/analytics
      - name: Reject analytics production dependency vulnerabilities
        run: npm audit --omit=dev --prefix services/analytics --audit-level=high
      - name: Apply analytics migrations and run PostgreSQL tests
        env:
          ANALYTICS_DATABASE_ADMIN_URL: postgresql://analytics_owner:***@127.0.0.1:55433/analytics
          ANALYTICS_TEST_DATABASE_URL: postgresql://analytics_owner:***@127.0.0.1:55433/analytics
        run: |
          npm run migrate --prefix services/analytics
          npm test --prefix services/analytics
      - name: Validate operational artifacts
        env:
          ANALYTICS_IMAGE_TAG: test
          ANALYTICS_POSTGRES_PASSWORD: owner_test_password
          ANALYTICS_COLLECTOR_DATABASE_PASSWORD: collector_test_password_0123456789
          ANALYTICS_DASHBOARD_DATABASE_PASSWORD: dashboard_test_password_0123456789
          ANALYTICS_ENV_FILE: analytics.env.example
        run: |
          bash -n ops/analytics/*.sh
          docker compose --env-file ops/analytics/analytics.env.example -f ops/analytics/compose.yml config --quiet

  required-impact-checks:
    needs: [impact, lint-and-build, test, tapestry, playlist, analytics]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: change-impact-${{ github.run_id }}
      - name: Reject missing, failed, cancelled, or skipped selected jobs
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          LINT_RESULT: ${{ needs.lint-and-build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TAPESTRY_RESULT: ${{ needs.tapestry.result }}
          PLAYLIST_RESULT: ${{ needs.playlist.result }}
          ANALYTICS_RESULT: ${{ needs.analytics.result }}
        run: |
          set -euo pipefail
          jq -n \
            --arg impact "$IMPACT_RESULT" --arg lint "$LINT_RESULT" --arg test "$TEST_RESULT" \
            --arg tapestry "$TAPESTRY_RESULT" --arg playlist "$PLAYLIST_RESULT" --arg analytics "$ANALYTICS_RESULT" \
            '[{check:"impact",conclusion:$impact},{check:"lint-and-build",conclusion:$lint},
              {check:"test",conclusion:$test},{check:"tapestry",conclusion:$tapestry},
              {check:"playlist",conclusion:$playlist},{check:"analytics",conclusion:$analytics}]' > impact-results.json
          node scripts/ci/impact-recovery.mjs validate-impact --impact impact-plan.json
          node scripts/ci/change-impact.mjs verify-results --impact impact-plan.json --results impact-results.json
