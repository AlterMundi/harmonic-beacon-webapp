name: Deploy

on:
  push:
    branches: [release]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The reusable workflow checks the exact release commit in a throwaway
  # Postgres + LiveKit + browser stack before mona can run any release step.
  release-e2e:
    uses: ./.github/workflows/e2e.yml

  deploy:
    needs: release-e2e
    runs-on: [self-hosted, mona]
    steps:
      - name: Verify deploy runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = mona
          test "$(id -un)" = beacon-runner
          test -x /usr/local/sbin/hb-deploy

      - uses: actions/checkout@v4

      - name: Verify privileged helper provenance
        shell: bash
        run: |
          set -euo pipefail
          cmp --silent deploy/hb-deploy-root /usr/local/sbin/hb-deploy

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm

      - name: Verify code and shared contract
        run: |
          npm ci
          npm ci --prefix services/tapestry
          npm run contract:commerce:verify
          npm test
          npm test --prefix services/tapestry
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --prefix services/tapestry --audit-level=high
          npm audit --omit=dev --prefix services/playlist-bot --audit-level=high
          npx tsc --noEmit
          npm run lint -- --quiet

      - name: Verify production prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-deploy preflight \
            "$GITHUB_WORKSPACE" "$GITHUB_SHA"

      - name: Preserve immutable rollback image
        id: rollback
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-deploy preserve "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Build commit image
        shell: bash
        run: |
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          database_schema_version="$(find prisma/migrations -mindepth 1 -maxdepth 1 \
            -type d -printf '%f\n' | sort | tail -1)"
          test -n "$database_schema_version"
          sudo -n /usr/local/sbin/hb-deploy build \
            "$GITHUB_WORKSPACE" "$GITHUB_SHA" "$build_time" "$database_schema_version"

      - name: Apply additive migrations
        shell: bash
        run: |
          sudo -n /usr/local/sbin/hb-deploy migrate \
            "$GITHUB_WORKSPACE" "$GITHUB_SHA"

      - name: Replace app, reconciler and tapestry
        shell: bash
        run: |
          sudo -n /usr/local/sbin/hb-deploy replace \
            "$GITHUB_WORKSPACE" "$GITHUB_SHA"

      - name: Wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          for _attempt in $(seq 1 60); do
            app_health="$(sudo -n /usr/local/sbin/hb-deploy health beacon-app 2>/dev/null || true)"
            worker_health="$(sudo -n /usr/local/sbin/hb-deploy health beacon-commerce-reconciler 2>/dev/null || true)"
            tapestry_health="$(sudo -n /usr/local/sbin/hb-deploy health beacon-tapestry 2>/dev/null || true)"
            if [ "$app_health" = healthy ] && [ "$worker_health" = healthy ] && \
              [ "$tapestry_health" = healthy ] && \
              curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          sudo -n /usr/local/sbin/hb-deploy status \
            "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          exit 1

      - name: Verify deployed revision publicly
        shell: bash
        run: |
          set -euo pipefail
          verify_revision() {
            local url="$1"
            local body
            body="$(curl --fail --silent --show-error "$url")"
            HEALTH_BODY="$body" EXPECTED_GIT_SHA="$GITHUB_SHA" node -e '
              const health = JSON.parse(process.env.HEALTH_BODY || "null");
              if (health?.schemaVersion !== "health.response.v2") process.exit(1);
              if (health?.gitSha !== process.env.EXPECTED_GIT_SHA) process.exit(1);
              if (typeof health?.buildTime !== "string") process.exit(1);
              if (health?.databaseSchemaVersion === "unknown") process.exit(1);
              if (health?.contractVersions?.commerceEntitlement !== "commerce-entitlement.v1") process.exit(1);
            '
          }

          verify_revision http://127.0.0.1:3000/api/health
          for _attempt in $(seq 1 30); do
            if verify_revision https://live.harmonicbeacon.com/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Public health never served expected revision $GITHUB_SHA" >&2
          exit 1

      - name: Verify private boundary and secret isolation
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-deploy boundary

          for method in GET POST; do
            code="$(curl --silent --show-error --output /dev/null \
              --request "$method" --header 'Content-Type: application/json' \
              --data '{}' --write-out '%{http_code}' \
              https://live.harmonicbeacon.com/api/test-login)"
            test "$code" = 404 || {
              echo "Production test-login $method returned $code instead of 404" >&2
              exit 1
            }
          done

          for method in GET PUT; do
            code="$(curl --silent --show-error --output /dev/null \
              --request "$method" --header 'Content-Type: application/json' \
              --data '{}' --write-out '%{http_code}' \
              https://live.harmonicbeacon.com/api/internal/v1/commerce-entitlements/ticket-tailor/deploy-probe)"
            test "$code" = 404 || {
              echo "Public internal $method returned $code instead of 404" >&2
              exit 1
            }
          done

      - name: Roll back immutable service images on failure
        if: ${{ failure() && (steps.rollback.outputs.app_available == 'true' || steps.rollback.outputs.tapestry_available == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/hb-deploy rollback \
            "$GITHUB_WORKSPACE" "$GITHUB_RUN_ID" \
            "${{ steps.rollback.outputs.app_available }}" \
            "${{ steps.rollback.outputs.tapestry_available }}"
