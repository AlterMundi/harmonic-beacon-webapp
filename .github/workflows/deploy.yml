name: Deploy (security safety hold)

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: harmonic-beacon-production-release
  cancel-in-progress: false

jobs:
  safety-hold:
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed while legacy source deployment is disabled
        run: |
          echo 'Security safety hold: legacy source deployment is disabled for every HB_RELEASE_LANE_STATE. Use the reviewed OCI lane only after its remaining remediation gates are closed.' >&2
          exit 1
