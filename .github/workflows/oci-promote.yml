name: Promote qualified OCI release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful OCI candidate workflow run id
        required: true
        type: string
      manifest_sha256:
        description: Exact canonical release-manifest.json SHA-256
        required: true
        type: string
      target:
        description: Shadow validation or production replacement
        required: true
        type: choice
        options: [shadow, production]

concurrency:
  group: oci-promote-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.bind.outputs.source_sha }}
      source_tree: ${{ steps.bind.outputs.source_tree }}
      config_sha256: ${{ steps.bind.outputs.config_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind a trusted successful candidate run
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          test "$(jq -r .name <<<"$run")" = 'OCI release candidate'
          test "$(jq -r .head_repository.full_name <<<"$run")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .head_branch <<<"$run")" = main
          test "$(jq -r .conclusion <<<"$run")" = success
          event="$(jq -r .event <<<"$run")"
          test "$event" = push -o "$event" = workflow_dispatch
          source_sha="$(jq -r .head_sha <<<"$run")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          source_tree="$(git rev-parse "${source_sha}^{tree}")"
          profile=production
          [ "$TARGET" = production ] || profile=live-staging
          config_sha256="sha256:$(sha256sum "deploy/runtime-public-config/${profile}.json" | cut -d' ' -f1)"
          printf 'source_sha=%s\nsource_tree=%s\nconfig_sha256=%s\n' \
            "$source_sha" "$source_tree" "$config_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualified-release-${{ inputs.candidate_run_id }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact downloaded manifest bytes
        env:
          EXPECTED: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum candidate/release-manifest.json | cut -d' ' -f1)" = "$EXPECTED"
          test "$(cut -d' ' -f1 candidate/release-manifest.sha256)" = "$EXPECTED"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion-input-${{ github.run_id }}
          path: candidate
          if-no-files-found: error
          retention-days: 2

  promote:
    needs: resolve
    if: vars.HB_OCI_PROMOTION_ENABLED == 'true'
    environment: ${{ inputs.target }}
    runs-on: [self-hosted, mona]
    steps:
      - name: Verify dedicated runner identity
        run: |
          set -euo pipefail
          test "$(hostname -s)" = mona
          test "$(id -un)" = beacon-runner
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - name: Verify installed privileged implementation
        run: |
          set -euo pipefail
          cmp --silent deploy/hb-deploy-root /usr/local/sbin/hb-deploy
          cmp --silent deploy/hb-artifact-verify.mjs /usr/local/libexec/harmonic-beacon/hb-artifact-verify
          cmp --silent scripts/ci/release-manifest.mjs /usr/local/libexec/harmonic-beacon/release-manifest.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: promotion-input-${{ github.run_id }}
          path: .hb-artifacts/${{ inputs.candidate_run_id }}/candidate
      - name: Prepare exact digest set through the restricted root helper
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/hb-deploy artifact-prepare "$GITHUB_WORKSPACE" \
            '${{ needs.resolve.outputs.source_sha }}' '${{ needs.resolve.outputs.source_tree }}' \
            '${{ inputs.candidate_run_id }}' '${{ inputs.manifest_sha256 }}' \
            '${{ inputs.target }}' '${{ needs.resolve.outputs.config_sha256 }}'
          sudo /usr/local/sbin/hb-deploy artifact-preflight "$GITHUB_WORKSPACE" \
            '${{ needs.resolve.outputs.source_sha }}' '${{ inputs.candidate_run_id }}' '${{ inputs.target }}'
      - name: Record shadow status without replacing production
        if: inputs.target == 'shadow'
        run: sudo /usr/local/sbin/hb-deploy artifact-status "$GITHUB_WORKSPACE" '${{ inputs.candidate_run_id }}' shadow
      - name: Apply migration and replace from the prepared digest set
        if: inputs.target == 'production'
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/hb-deploy artifact-migrate "$GITHUB_WORKSPACE" '${{ inputs.candidate_run_id }}'
          sudo /usr/local/sbin/hb-deploy artifact-replace "$GITHUB_WORKSPACE" '${{ inputs.candidate_run_id }}'
          sudo /usr/local/sbin/hb-deploy artifact-status "$GITHUB_WORKSPACE" '${{ inputs.candidate_run_id }}' production
      - name: Restore the manifest-bound rollback digest set
        if: failure() && inputs.target == 'production'
        run: sudo /usr/local/sbin/hb-deploy artifact-rollback "$GITHUB_WORKSPACE" '${{ inputs.candidate_run_id }}'
