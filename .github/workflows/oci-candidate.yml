name: OCI release candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: oci-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.HB_OCI_CANDIDATES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - artifact: app
            repository: ghcr.io/altermundi/harmonic-beacon-app
            context: .
            dockerfile: Dockerfile
          - artifact: tapestry
            repository: ghcr.io/altermundi/harmonic-beacon-tapestry
            context: .
            dockerfile: services/tapestry/Dockerfile
          - artifact: playlist-bot
            repository: ghcr.io/altermundi/harmonic-beacon-playlist-bot
            context: .
            dockerfile: services/playlist-bot/Dockerfile
          - artifact: analytics
            repository: ghcr.io/altermundi/harmonic-beacon-analytics
            context: .
            dockerfile: services/analytics/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind trusted integrated source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          created_at="$(date -u -d "$(git show -s --format=%cI HEAD)" +%Y-%m-%dT%H:%M:%SZ)"
          printf 'created_at=%s\n' "$created_at" >> "$GITHUB_OUTPUT"
          printf 'schema=%s\n' "$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort | tail -n 1)" >> "$GITHUB_OUTPUT"
        id: source
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build once and publish immutable candidate
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.source.outputs.created_at }}
          build-args: |
            BEACON_GIT_SHA=${{ github.sha }}
            BEACON_BUILD_TIME=${{ steps.source.outputs.created_at }}
            BEACON_DATABASE_SCHEMA_VERSION=${{ steps.source.outputs.schema }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
      - name: Sign and verify supply-chain evidence
        env:
          IMAGE_REF: ${{ matrix.repository }}@${{ steps.image.outputs.digest }}
          IDENTITY: https://github.com/AlterMundi/harmonic-beacon-webapp/.github/workflows/oci-candidate.yml@refs/heads/main
        run: |
          set -euo pipefail
          mkdir evidence
          cosign sign --yes --bundle evidence/signature.bundle.json "$IMAGE_REF"
          cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity="$IDENTITY" "$IMAGE_REF" > evidence/signature.verify.json
          docker buildx imagetools inspect --format '{{ json .SBOM }}' \
            "$IMAGE_REF" > evidence/sbom.bundle.json
          docker buildx imagetools inspect --format '{{ json .Provenance }}' \
            "$IMAGE_REF" > evidence/provenance.bundle.json
          test "$(jq -r type evidence/sbom.bundle.json)" != null
          test "$(jq -r type evidence/provenance.bundle.json)" != null
          jq -n --arg artifact '${{ matrix.artifact }}' \
            --arg repository '${{ matrix.repository }}' \
            --arg digest '${{ steps.image.outputs.digest }}' \
            --arg sbom "sha256:$(sha256sum evidence/sbom.bundle.json | cut -d' ' -f1)" \
            --arg provenance "sha256:$(sha256sum evidence/provenance.bundle.json | cut -d' ' -f1)" \
            --arg signature "sha256:$(sha256sum evidence/signature.bundle.json | cut -d' ' -f1)" \
            '{artifactId:$artifact,repository:$repository,digest:$digest,sbomDigest:$sbom,provenanceDigest:$provenance,signatureBundleDigest:$signature}' \
            > evidence/evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-evidence-${{ matrix.artifact }}
          path: evidence
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: oci-evidence-*
          path: evidence
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Assemble candidate inputs
        env:
          HB_POSTGRES_IMAGE_REF: ${{ vars.HB_POSTGRES_IMAGE_REF }}
          HB_LIVEKIT_IMAGE_REF: ${{ vars.HB_LIVEKIT_IMAGE_REF }}
          HB_RELEASE_BASE_MANIFEST_SHA256: ${{ vars.HB_RELEASE_BASE_MANIFEST_SHA256 }}
          HB_RELEASE_ROLLBACK_JSON: ${{ vars.HB_RELEASE_ROLLBACK_JSON }}
        run: |
          set -euo pipefail
          node scripts/ci/create-candidate.mjs --evidence evidence --output candidate.json
          node scripts/ci/release-manifest.mjs candidate-hash --manifest candidate.json > candidate.sha256
      - name: Qualify the exact published digest set
        run: |
          set -euo pipefail
          node scripts/ci/qualify-oci.mjs --manifest candidate.json \
            --compose deploy/qualification.compose.yml --receipt qualification-receipt.json --no-build
      - name: Seal canonical release manifest
        run: |
          set -euo pipefail
          QUALIFIED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EXPIRES_AT="$(date -u -d '+24 hours' +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg runId "$GITHUB_RUN_ID" --arg qualifiedAt "$QUALIFIED_AT" \
            --arg expiresAt "$EXPIRES_AT" --arg candidateIdentitySha256 "$(cat candidate.sha256)" \
            --arg receiptSha256 "sha256:$(sha256sum qualification-receipt.json | cut -d' ' -f1)" \
            '{runId:$runId,result:"success",qualifiedAt:$qualifiedAt,expiresAt:$expiresAt,candidateIdentitySha256:$candidateIdentitySha256,receiptSha256:$receiptSha256}' \
            > qualification.json
          node scripts/ci/release-manifest.mjs assemble --candidate candidate.json \
            --qualification qualification.json --output release-manifest.json
          sha256sum release-manifest.json > release-manifest.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-release-${{ github.run_id }}
          path: |
            release-manifest.json
            release-manifest.sha256
            qualification-receipt.json
            evidence/
          if-no-files-found: error
          retention-days: 14
