name: Delivery gate

on:
  pull_request_target:
    branches: [main, release]
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled, closed]
  workflow_run:
    workflows: [CI, E2E quality gates, Audio boundary]
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect in shadow mode
        required: true
        type: number
      expected_base:
        description: Expected target branch
        required: true
        default: main
        type: choice
        options: [main, release]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

concurrency:
  group: delivery-gate-${{ github.event_name == 'workflow_dispatch' && 'shadow' || 'required' }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  delivery-gate:
    name: Trusted delivery monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Resolve the exact protected PR and base
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_EXPECTED_BASE: ${{ inputs.expected_base }}
        run: |
          set -euo pipefail
          echo 'active=false' >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            pr_number="$INPUT_PR_NUMBER"
            expected_base="$INPUT_EXPECTED_BASE"
            context=delivery-gate-shadow
            event_head=''
            event_base=''
          elif [ "$EVENT_NAME" = workflow_run ]; then
            context=delivery-gate
            event_head="$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
            associated_prs="$(gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/pulls?state=open&per_page=100")"
            pr_number="$(jq -r --arg head "$event_head" \
              '[.[][] | select(.head.sha == $head and .state == "open" and (.base.ref == "main" or .base.ref == "release"))][0].number // empty' \
              <<<"$associated_prs")"
            if [ -z "$pr_number" ]; then exit 0; fi
            expected_base="$(jq -r --argjson pr "$pr_number" \
              '.workflow_run.pull_requests[]? | select(.number == $pr) | .base.ref' "$GITHUB_EVENT_PATH")"
            event_base="$(jq -r --argjson pr "$pr_number" \
              '.workflow_run.pull_requests[]? | select(.number == $pr) | .base.sha' "$GITHUB_EVENT_PATH")"
          else
            pr_number="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
            expected_base="$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")"
            context=delivery-gate
            event_head="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            event_base="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
            if [ "$EVENT_ACTION" = closed ]; then
              associated_prs="$(gh api --paginate --slurp \
                -H 'Accept: application/vnd.github+json' \
                "repos/$REPOSITORY/pulls?state=open&per_page=100")"
              pr_number="$(jq -r --arg head "$event_head" \
                '[.[][] | select(.head.sha == $head and (.base.ref == "main" or .base.ref == "release"))][0].number // empty' \
                <<<"$associated_prs")"
              if [ -z "$pr_number" ]; then exit 0; fi
              expected_base=''
              event_base=''
            fi
          fi

          initial_pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          if [ -z "$event_head" ]; then event_head="$(jq -r '.head.sha' <<<"$initial_pr")"; fi
          if [ -z "$event_base" ]; then event_base="$(jq -r '.base.sha' <<<"$initial_pr")"; fi
          if [ -z "$expected_base" ]; then expected_base="$(jq -r '.base.ref' <<<"$initial_pr")"; fi
          current_head="$(jq -r '.head.sha' <<<"$initial_pr")"
          base_sha="$(jq -r '.base.sha' <<<"$initial_pr")"
          merge_sha="$(jq -r '.merge_commit_sha' <<<"$initial_pr")"
          case "$expected_base" in
            main|release) ;;
            *) exit 0 ;;
          esac
          for value in "$event_head" "$event_base" "$current_head" "$base_sha" "$merge_sha"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || { echo 'resolved PR identity is incomplete' >&2; exit 1; }
          done

          {
            echo 'active=true'
            echo "pr_number=$pr_number"
            echo "expected_base=$expected_base"
            echo "event_head=$event_head"
            echo "event_base=$event_base"
            echo "base_sha=$base_sha"
            echo "merge_sha=$merge_sha"
            echo "context=$context"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the exact trusted base implementation only
        if: steps.target.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.base_sha }}
          persist-credentials: false

      - name: Evaluate exact candidate checks
        if: steps.target.outputs.active == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          EXPECTED_BASE: ${{ steps.target.outputs.expected_base }}
          EVENT_HEAD: ${{ steps.target.outputs.event_head }}
          EVENT_BASE: ${{ steps.target.outputs.event_base }}
          INITIAL_MERGE: ${{ steps.target.outputs.merge_sha }}
          CONTEXT: ${{ steps.target.outputs.context }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          pr_number="$PR_NUMBER"
          expected_base="$EXPECTED_BASE"
          event_head="$EVENT_HEAD"
          event_base="$EVENT_BASE"
          current_merge="$INITIAL_MERGE"
          context="$CONTEXT"
          evaluator_base="$(git rev-parse HEAD)"
          test "$evaluator_base" = "${{ steps.target.outputs.base_sha }}"

          post_status() {
            local state="$1" description="$2" sha="$3"
            gh api --method POST "repos/$REPOSITORY/statuses/$sha" \
              -f state="$state" \
              -f context="$context" \
              -f description="${description:0:140}" \
              -f target_url="$RUN_URL" >/dev/null
          }

          post_status pending 'waiting for exact current-base required checks' "$current_merge"
          initial_pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          timeline="$(gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/issues/$pr_number/timeline?per_page=100")"
          pr_created_at="$(jq -r '.created_at' <<<"$initial_pr")"
          evidence_not_before="$(jq -r --arg created "$pr_created_at" \
            '([.[][] | select(.event == "base_ref_changed") | .created_at] | max) // $created' \
            <<<"$timeline")"
          payload_dir="$(mktemp -d)"
          trap 'rm -rf "$payload_dir"' EXIT

          fetch_check_pages() {
            gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/commits/$event_head/check-runs?per_page=100&filter=all"
          }
          canonical_check_snapshot() {
            jq -S -c '{
              totals: ([.[]?.total_count] | unique),
              runs: ([.[]?.check_runs[]?] | sort_by(.id))
            }'
          }

          for attempt in $(seq 0 95); do
            pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
            current_pr_number="$(jq -r '.number' <<<"$pr")"
            current_pr_state="$(jq -r '.state' <<<"$pr")"
            current_head="$(jq -r '.head.sha' <<<"$pr")"
            current_base="$(jq -r '.base.sha' <<<"$pr")"
            current_base_ref="$(jq -r '.base.ref' <<<"$pr")"
            current_merge="$(jq -r '.merge_commit_sha' <<<"$pr")"
            reported_changed_file_count="$(jq -r '.changed_files' <<<"$pr")"

            if [ "$context" = delivery-gate ]; then
              protected_pr_count="$(gh api --paginate --slurp \
                -H 'Accept: application/vnd.github+json' \
                "repos/$REPOSITORY/pulls?state=open&per_page=100" \
                | jq --arg head "$event_head" \
                  '[.[][] | select(.head.sha == $head and .state == "open" and (.base.ref == "main" or .base.ref == "release"))] | length')"
            else
              protected_pr_count=1
            fi
            file_records="$(gh api --paginate --slurp \
              "repos/$REPOSITORY/pulls/$pr_number/files?per_page=100")"
            listed_changed_file_count="$(jq '[.[][]] | length' <<<"$file_records")"
            changed_files="$(jq '[.[][] | .filename, .previous_filename?] | map(select(type == "string" and length > 0)) | unique' <<<"$file_records")"

            check_pages_a="$(fetch_check_pages)"
            check_pages_b="$(fetch_check_pages)"
            if [ "$(canonical_check_snapshot <<<"$check_pages_a")" = "$(canonical_check_snapshot <<<"$check_pages_b")" ]; then
              check_snapshot_stable=true
            else
              check_snapshot_stable=false
            fi
            check_pages="$check_pages_b"
            reported_check_run_count="$(jq '[.[]?.total_count] | unique | if length == 1 then .[0] else 0 end' <<<"$check_pages")"
            workflow_pages="$(gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/actions/runs?head_sha=$event_head&event=pull_request&per_page=100")"
            check_suite_ids="$(jq '[.[]?.check_runs[]?.check_suite.id] | unique' <<<"$check_pages")"
            check_suites='[]'
            while IFS= read -r suite_id; do
              suite="$(gh api -H 'Accept: application/vnd.github+json' \
                "repos/$REPOSITORY/check-suites/$suite_id")"
              check_suites="$(jq --argjson suite "$suite" '. + [$suite]' <<<"$check_suites")"
            done < <(jq -r '.[]' <<<"$check_suite_ids")
            check_runs="$(jq -n --argjson checks "$check_pages" --argjson suites "$check_suites" --argjson workflows "$workflow_pages" '
              [$checks[]?.check_runs[]? as $check
                | ($suites | map(select(.id == $check.check_suite.id)) | first // null) as $suite
                | ($workflows[]?.workflow_runs // []
                    | map(select(.check_suite_id == $check.check_suite.id))
                    | sort_by(.run_attempt, .id)
                    | last // null) as $workflow
                | {
                    id: $check.id,
                    name: $check.name,
                    head_sha: $check.head_sha,
                    status: $check.status,
                    conclusion: $check.conclusion,
                    completed_at: $check.completed_at,
                    started_at: $check.started_at,
                    created_at: $check.created_at,
                    app: {id: $check.app.id, slug: $check.app.slug},
                    check_suite: (if $suite == null then null else {
                      id: $suite.id,
                      head_sha: $suite.head_sha,
                      app: {id: $suite.app.id, slug: $suite.app.slug}
                    } end),
                    workflow_run: (if $workflow == null then null else {
                      id: $workflow.id,
                      check_suite_id: $workflow.check_suite_id,
                      run_attempt: $workflow.run_attempt,
                      name: $workflow.name,
                      path: $workflow.path,
                      event: $workflow.event,
                      head_sha: $workflow.head_sha,
                      run_started_at: $workflow.run_started_at,
                      pull_requests: $workflow.pull_requests
                    } end)
                  }
              ]')"
            printf '%s\n' "$changed_files" > "$payload_dir/changed-files.json"
            printf '%s\n' "$check_runs" > "$payload_dir/check-runs.json"

            compare_status="$(gh api "repos/$REPOSITORY/compare/$current_base...$event_head" --jq '.status' 2>/dev/null || true)"
            if [ "$compare_status" = ahead ] || [ "$compare_status" = identical ]; then
              base_is_ancestor=true
            else
              base_is_ancestor=false
            fi
            if [ "$attempt" -eq 95 ]; then deadline_expired=true; else deadline_expired=false; fi

            payload="$(jq -n \
              --argjson prNumber "$pr_number" \
              --arg expectedBaseRef "$expected_base" \
              --arg eventHeadSha "$event_head" \
              --arg eventBaseSha "$event_base" \
              --argjson currentPrNumber "$current_pr_number" \
              --arg currentPrState "$current_pr_state" \
              --arg currentHeadSha "$current_head" \
              --arg currentBaseSha "$current_base" \
              --arg currentBaseRef "$current_base_ref" \
              --arg currentMergeSha "$current_merge" \
              --arg evaluatorBaseSha "$evaluator_base" \
              --argjson baseIsAncestor "$base_is_ancestor" \
              --arg evidenceNotBefore "$evidence_not_before" \
              --argjson protectedPrCount "$protected_pr_count" \
              --argjson reportedChangedFileCount "$reported_changed_file_count" \
              --argjson listedChangedFileCount "$listed_changed_file_count" \
              --argjson reportedCheckRunCount "$reported_check_run_count" \
              --argjson checkSnapshotStable "$check_snapshot_stable" \
              --slurpfile changedFiles "$payload_dir/changed-files.json" \
              --slurpfile checkRuns "$payload_dir/check-runs.json" \
              --argjson deadlineExpired "$deadline_expired" \
              '{prNumber:$prNumber,expectedBaseRef:$expectedBaseRef,eventHeadSha:$eventHeadSha,eventBaseSha:$eventBaseSha,currentPrNumber:$currentPrNumber,currentPrState:$currentPrState,currentHeadSha:$currentHeadSha,currentBaseSha:$currentBaseSha,currentBaseRef:$currentBaseRef,currentMergeSha:$currentMergeSha,evaluatorBaseSha:$evaluatorBaseSha,baseIsAncestor:$baseIsAncestor,evidenceNotBefore:$evidenceNotBefore,protectedPrCount:$protectedPrCount,reportedChangedFileCount:$reportedChangedFileCount,listedChangedFileCount:$listedChangedFileCount,reportedCheckRunCount:$reportedCheckRunCount,checkSnapshotStable:$checkSnapshotStable,changedFiles:$changedFiles[0],checkRuns:$checkRuns[0],deadlineExpired:$deadlineExpired}')"
            evaluation="$(node scripts/ci/required-checks.mjs <<<"$payload")"
            state="$(jq -r '.state' <<<"$evaluation")"
            description="$(jq -r '.description' <<<"$evaluation")"

            if [ "$state" = success ]; then
              final_pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
              final_number="$(jq -r '.number' <<<"$final_pr")"
              final_state="$(jq -r '.state' <<<"$final_pr")"
              final_head="$(jq -r '.head.sha' <<<"$final_pr")"
              final_base="$(jq -r '.base.sha' <<<"$final_pr")"
              final_base_ref="$(jq -r '.base.ref' <<<"$final_pr")"
              final_merge="$(jq -r '.merge_commit_sha' <<<"$final_pr")"
              final_timeline="$(gh api --paginate --slurp \
                -H 'Accept: application/vnd.github+json' \
                "repos/$REPOSITORY/issues/$pr_number/timeline?per_page=100")"
              final_evidence_not_before="$(jq -r --arg created "$pr_created_at" \
                '([.[][] | select(.event == "base_ref_changed") | .created_at] | max) // $created' \
                <<<"$final_timeline")"
              final_check_pages="$(fetch_check_pages)"
              if [ "$final_number" != "$current_pr_number" ] \
                  || [ "$final_state" != "$current_pr_state" ] \
                  || [ "$final_head" != "$current_head" ] \
                  || [ "$final_base" != "$current_base" ] \
                  || [ "$final_base_ref" != "$current_base_ref" ] \
                  || [ "$final_merge" != "$current_merge" ] \
                  || [ "$final_evidence_not_before" != "$evidence_not_before" ] \
                  || [ "$(canonical_check_snapshot <<<"$final_check_pages")" != "$(canonical_check_snapshot <<<"$check_pages_b")" ]; then
                if [[ "$final_merge" =~ ^[0-9a-f]{40}$ ]]; then
                  post_status pending 'PR changed during final delivery evaluation' "$final_merge"
                fi
                exit 1
              fi
              post_status success "$description" "$final_merge"
              exit 0
            fi
            if [ "$state" = failure ]; then
              post_status failure "$description" "$current_merge"
              first_reason="$(jq -r '.reasons[0] // "invalid-input"' <<<"$evaluation")"
              case "$first_reason" in
                wrong-pr|obsolete-head|retargeted-base|wrong-evaluator-base|pr-not-open|unexpected-base|obsolete-base|incomplete-files) exit 1 ;;
              esac
              if [ "$attempt" -eq 95 ]; then exit 1; fi
              sleep 60
              continue
            fi
            post_status pending "$description" "$current_merge"
            if [ "$attempt" -eq 95 ]; then
              post_status failure 'delivery gate deadline expired while checks were pending' "$current_merge"
              exit 1
            fi
            sleep 60
          done
