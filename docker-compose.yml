# Harmonic Beacon — Production Docker Compose (mona)
# Weekend 2026-07-31 / 2026-08-02
#
# Services: postgres, livekit, app (Next.js), playlist-bot, tapestry
# Reverse proxy: nginx on host (TLS terminated at nginx -> containers via docker network)
#
# Prerequisites:
#   - /etc/harmonic-beacon/production.env  (secrets, mode 0600)
#   - /etc/harmonic-beacon/livekit.yaml     (LiveKit server config)
#   - /etc/harmonic-beacon/keys.yaml        (LiveKit API key:secret)
#   - /mnt/beacon-data/postgres/            (persistent PG data)
#   - /mnt/beacon-data/beacon-records/      (bed audio library, read-only)
#   - nginx + TLS on host (deploy/nginx-harmonic-beacon.conf)
#
# Usage:
#   docker compose build
#   docker compose up -d

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: beacon-postgres
    restart: unless-stopped
    env_file:
      - /etc/harmonic-beacon/production.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-beacon}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?required}
      - POSTGRES_DB=${POSTGRES_DB:-beacon}
    volumes:
      - /mnt/beacon-data/postgres:/var/lib/postgresql/data
    networks:
      - beacon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beacon} -d ${POSTGRES_DB:-beacon}"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── LiveKit SFU ──────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: beacon-livekit
    restart: unless-stopped
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_KEYS:?required}
    volumes:
      - /etc/harmonic-beacon/livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml
    ports:
      - "7881:7881/udp"                       # WebRTC ICE / media
      - "7881:7881/tcp"                        # ICE TCP fallback
      - "3478:3478"                             # TURN UDP
      - "3478:3478/udp"                        # TURN UDP
      - "127.0.0.1:7880:7880"                 # signaling (nginx-only)
    networks:
      - beacon
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 3G
        reservations:
          cpus: '2'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  # ── Next.js app ───────────────────────────────────────────────────
  app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL:-wss://live.harmonicbeacon.com}
    container_name: beacon-app
    restart: unless-stopped
    env_file:
      - /etc/harmonic-beacon/production.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-beacon}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-beacon}
      - LIVEKIT_INTERNAL_URL=http://beacon-livekit:7880
    ports:
      - "127.0.0.1:3000:3000"                # nginx-only
    networks:
      - beacon
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Playlist bot (crossfader bed) ────────────────────────────────
  playlist-bot:
    build: ./services/playlist-bot
    container_name: beacon-playlist-bot
    restart: unless-stopped
    env_file:
      - /etc/harmonic-beacon/production.env
    environment:
      - LIVEKIT_URL=ws://beacon-livekit:7880
      - LIVEKIT_ROOM_NAME=${LIVEKIT_ROOM_NAME:-beacon}
      - BOT_IDENTITY=playlist-bot
      - BEACON_RECORDS_PATH=/data/beacon-records
    volumes:
      - /mnt/beacon-data/beacon-records:/data/beacon-records:ro
    networks:
      - beacon
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const t=Number(fs.readFileSync('/tmp/playlist-bot-heartbeat','utf8'));if(Date.now()-t>60000)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - livekit
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Tapestry (audience presence grid) ────────────────────────────
  tapestry:
    build:
      context: ./services/tapestry
      dockerfile: Dockerfile
    container_name: beacon-tapestry
    restart: unless-stopped
    env_file:
      - /etc/harmonic-beacon/production.env
    environment:
      - TAPESTRY_PORT=3100
      - TAPESTRY_HOST=0.0.0.0
      - MALLOC_ARENA_MAX=2                          # prevents libvips RSS hoard
    ports:
      - "127.0.0.1:3100:3100"                      # nginx-only
    networks:
      - beacon
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

networks:
  beacon:
    driver: bridge
