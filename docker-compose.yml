# Harmonic Beacon - Production Docker Compose
# Next.js app + playlist bot
# PostgreSQL runs on the host (not containerized)
#
# Prerequisites:
#   - Host PostgreSQL with beacon user/db (see deploy/setup-host-postgres.sh)
#   - Secrets persisted in /etc/sai-harmonic-beacon/production.env
#     (written by deploy workflow, survives container restarts)
#
# Usage:
#   docker compose build
#   docker compose up -d

services:
  app:
    build: .
    container_name: harmonic-beacon
    restart: unless-stopped
    ports:
      - "3003:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - /etc/sai-harmonic-beacon/production.env
    environment:
      - NODE_ENV=production
      - AUTH_ZITADEL_ISSUER=${AUTH_ZITADEL_ISSUER:-https://auth.altermundi.net}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${AUTH_URL:-https://beacon.altermundi.net}
      - LIVEKIT_ROOM_NAME=${LIVEKIT_ROOM_NAME:-beacon}
      - MEDITATIONS_STORAGE_PATH=/data/meditations
      - UPLOADS_PATH=/data/uploads
      - MAX_UPLOAD_SIZE_MB=100
    volumes:
      - /mnt/n8n-data/harmonic-beacon/meditations:/data/meditations
      - /mnt/n8n-data/harmonic-beacon/uploads:/data/uploads
    networks:
      - beacon
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  playlist-bot:
    build: ./services/playlist-bot
    container_name: harmonic-beacon-playlist-bot
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - /etc/sai-harmonic-beacon/production.env
    environment:
      - LIVEKIT_URL=${LIVEKIT_INTERNAL_URL:-ws://host.docker.internal:7880}
      - LIVEKIT_ROOM_NAME=${LIVEKIT_ROOM_NAME:-beacon}
      - BOT_IDENTITY=playlist-bot
      - BEACON_RECORDS_PATH=/data/beacon-records
    volumes:
      - /mnt/n8n-data/harmonic-beacon/beacon-records:/data/beacon-records:ro
    networks:
      - beacon
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const t=Number(fs.readFileSync('/tmp/playlist-bot-heartbeat','utf8'));if(Date.now()-t>60000)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  beacon:
    driver: bridge
